<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快活CLUB 店舗比較</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>快活CLUB 店舗比較</h1>
  <p class="subtitle">全店舗の設備・サービス・料金を比較できる非公式の個人用ツールです</p>
</header>

<main>
  <section class="filters">
    <div class="filter-grid">
      <div class="filter-group">
        <p class="filter-group-label">都道府県（複数選択可・未選択なら全国）</p>
        <div class="chip-row" id="prefFilters"></div>
      </div>

      <div class="filter-group">
        <p class="filter-group-label">料金プラン</p>
        <div class="filter-row condition-row">
          <label>座席タイプ
            <select id="seatCategory">
              <option value="">指定なし（最安カテゴリ）</option>
              <option value="open">オープンシート</option>
              <option value="booth">ブース</option>
              <option value="amuse">アミューズシート</option>
              <option value="private">個室</option>
            </select>
          </label>
          <label>利用時間・プラン
            <select id="durationSelect">
              <option value="night_pack">ナイトパック</option>
              <option value="3">3時間パック</option>
              <option value="6">6時間パック</option>
              <option value="9">9時間パック</option>
              <option value="12">12時間パック</option>
              <option value="15">15時間パック</option>
              <option value="18">18時間パック</option>
              <option value="21">21時間パック</option>
              <option value="24">24時間パック</option>
            </select>
          </label>
          <label>曜日プラン
            <select id="dayTypeSelect">
              <option value="weekday">平日</option>
              <option value="weekend">休日（土日・祝日）</option>
            </select>
          </label>
          <label>予算（円以下・任意）
            <input type="number" id="priceMax" min="0" step="100" placeholder="例: 2000">
          </label>
        </div>
      </div>

      <div class="filter-group">
        <p class="filter-group-label">キーワード・設備</p>
        <div class="filter-row condition-row">
          <label>キーワード（店舗名・市区町村）
            <input type="text" id="keyword" placeholder="例: 渋谷 / 大阪市">
          </label>
          <label>並び替え
            <select id="sortSelect">
              <option value="price_asc">料金が安い順</option>
              <option value="price_desc">料金が高い順</option>
            </select>
          </label>
        </div>
        <div class="chip-row" id="facilityFilters"></div>
      </div>
    </div>
  </section>

  <section class="results">
    <div class="results-header">
      <h2>検索結果</h2>
      <span id="resultCount" class="result-count"></span>
    </div>
    <div class="table-scroll">
      <table id="storeTable">
        <thead>
          <tr>
            <th>比較</th>
            <th>店舗名</th>
            <th>都道府県</th>
            <th>市区町村</th>
            <th>座席タイプ</th>
            <th>料金</th>
            <th>主な設備</th>
            <th>詳細</th>
          </tr>
        </thead>
        <tbody id="storeTableBody"></tbody>
      </table>
    </div>
  </section>

  <section id="compareSection" class="hidden">
    <h2>選択した店舗を比較 <button id="clearCompare">クリア</button></h2>
    <div id="compareTableWrap"></div>
    <div id="comparePrices"></div>
  </section>
</main>

<footer>
  <p>
    データは <a href="https://www.kaikatsu.jp/" target="_blank" rel="noopener">快活CLUB公式サイト</a>
    から取得した公開情報を元にした非公式の参考情報です。料金画像はOCRによる自動読み取りのため誤りを含む場合があります。
    正確な情報は必ず公式サイト・各店舗にご確認ください。最終更新: <span id="updatedAt"></span>
  </p>
</footer>

<script src="app.js"></script>
</body>
</html>
